# Auto-generated by matugen

[app]
overall = { bg = "{{ base.background.hex }}" }

[mgr]
cwd = { fg = "{{ accent.primary.hex }}" }
find_keyword = { fg = "{{ accent.secondary.hex }}", bold = true }
marker_copied = { fg = "{{ state.success.hex }}" }
marker_cut = { fg = "{{ state.warning.hex }}" }
marker_marked = { fg = "{{ accent.tertiary.hex }}" }
marker_selected = { fg = "{{ accent.primary.hex }}" }

[indicator]
parent = { fg = "{{ accent.primary.hex }}", bg = "{{ base.background.hex }}" }
current = { fg = "{{ base.background.hex }}", bg = "{{ accent.primary.hex }}" }
preview = { fg = "{{ ui.border.hex }}", bg = "{{ base.background.hex }}" }

[tabs]
active = { fg = "{{ base.background.hex }}", bg = "{{ accent.primary.hex }}" }
inactive = { fg = "{{ base.foreground.hex }}", bg = "{{ ui.surface.hex }}" }

[mode]
normal_main = { fg = "{{ base.foreground.hex }}" }
normal_alt = { fg = "{{ base.foreground.hex }}", bg = "{{ ui.surface.hex }}" }
select_main = { fg = "{{ accent.secondary.hex }}" }
select_alt = { fg = "{{ accent.secondary.hex }}", bg = "{{ ui.surface.hex }}" }
unset_main = { fg = "{{ state.error.hex }}" }
unset_alt = { fg = "{{ state.error.hex }}", bg = "{{ ui.surface.hex }}" }

[status]
overall = { fg = "{{ base.foreground.hex }}", bg = "{{ ui.surface.hex }}" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

[which]
cols = 2
mask = { bg = "{{ ui.surface.hex }}" }
cand = { fg = "{{ accent.primary.hex }}", bold = true }
rest = { fg = "{{ base.foreground.hex }}" }
desc = { fg = "{{ base.foreground.hex }}", dim = true }
separator = " -> "
separator_style = { fg = "{{ ui.border.hex }}" }

[input]
border = { fg = "{{ accent.primary.hex }}" }
title = { fg = "{{ accent.primary.hex }}" }
value = { fg = "{{ base.foreground.hex }}" }
selected = { fg = "{{ base.background.hex }}", bg = "{{ accent.primary.hex }}" }

[confirm]
border = { fg = "{{ accent.primary.hex }}" }
title = { fg = "{{ accent.primary.hex }}" }
body = { fg = "{{ base.foreground.hex }}" }
list = { fg = "{{ base.foreground.hex }}" }
btn_yes = { fg = "{{ base.background.hex }}", bg = "{{ state.success.hex }}" }
btn_no = { fg = "{{ base.background.hex }}", bg = "{{ state.error.hex }}" }
btn_labels = [" Yes ", " No "]

[spot]
border = { fg = "{{ accent.primary.hex }}" }
title = { fg = "{{ accent.primary.hex }}" }
tbl_col = { fg = "{{ accent.primary.hex }}" }
tbl_cell = { fg = "{{ base.foreground.hex }}" }

[tasks]
border = { fg = "{{ accent.primary.hex }}" }
title = { fg = "{{ accent.primary.hex }}" }
hovered = { fg = "{{ base.foreground.hex }}", bg = "{{ ui.surface.hex }}" }

[help]
on = { fg = "{{ accent.primary.hex }}" }
run = { fg = "{{ base.foreground.hex }}" }
desc = { fg = "{{ base.foreground.hex }}", dim = true }
hovered = { fg = "{{ base.foreground.hex }}", bg = "{{ ui.surface.hex }}" }
footer = { fg = "{{ base.foreground.hex }}", bg = "{{ ui.surface.hex }}" }

[icon]
dirs = [
  { name = ".config",   text = "", fg = "{{ accent.secondary.hex }}" },
  { name = ".git",      text = "", fg = "{{ accent.secondary.hex }}" },
  { name = ".github",   text = "", fg = "{{ accent.secondary.hex }}" },

  { name = "Books",       text = "󰂺", fg = "{{ accent.primary.hex }}" },
  { name = "Desktop",     text = "󱂵", fg = "{{ accent.primary.hex }}" },
  { name = "Documents",   text = "󰈙", fg = "{{ accent.primary.hex }}" },
  { name = "Downloads",   text = "󰉍", fg = "{{ accent.primary.hex }}" },
  { name = "Library",     text = "󱧼", fg = "{{ accent.primary.hex }}" },
  { name = "Music",       text = "󱍙", fg = "{{ accent.primary.hex }}" },
  { name = "Pictures",    text = "󰉏", fg = "{{ accent.primary.hex }}" },
  { name = "Projects",    text = "󱋣", fg = "{{ accent.primary.hex }}" },
  { name = "Public",      text = "󰉙", fg = "{{ accent.primary.hex }}" },
  { name = "Videos",      text = "󰉏", fg = "{{ accent.primary.hex }}" },
  { name = "VirtualBox VMs", text = "", fg = "{{ accent.primary.hex }}" },
]
conds = [
  { if = "orphan", text = "", fg = "{{ base.foreground.hex }}" },
  { if = "link",   text = "", fg = "{{ base.foreground.hex }}" },
  { if = "sticky", text = "", fg = "{{ base.foreground.hex }}" },

  { if = "dir & hovered", text = "", fg = "{{ accent.primary.hex }}" },

  { if = "dir & hidden",  text = "", fg = "{{ accent.secondary.hex }}" },

  { if = "dir",           text = "", fg = "{{ accent.primary.hex }}" },

  { if = "hidden & !dir", text = "", fg = "{{ accent.secondary.hex }}" },
  { if = "exec",          text = "", fg = "{{ base.foreground.hex }}" },
  { if = "block",         text = "", fg = "{{ base.foreground.hex }}" },
  { if = "char",          text = "", fg = "{{ base.foreground.hex }}" },
  { if = "fifo",          text = "", fg = "{{ base.foreground.hex }}" },
  { if = "sock",          text = "", fg = "{{ base.foreground.hex }}" },
  { if = "true",          text = "", fg = "{{ base.foreground.hex }}" },
]

[filetype]
rules = [
  { mime = "image/*", fg = "{{ base.foreground.hex }}" },
  { mime = "{audio,video}/*", fg = "{{ base.foreground.hex }}" },
  { mime = "text/*", fg = "{{ base.foreground.hex }}" },
  { mime = "application/*", fg = "{{ base.foreground.hex }}" },
  { url = "*",  fg = "{{ base.foreground.hex }}" },
]
