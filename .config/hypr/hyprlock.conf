# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# BACKGROUND
background {
    monitor =
    path = ~/.cache/awww/Current_wallpaper.jpg
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(244, 244, 244, 0.2)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgba(244, 244, 244, 0.75)
    fade_on_empty = false
    rounding = 16
    check_color = rgb(204, 136, 34)
    placeholder_text = Input Password...
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# LAYAUT
label {
  monitor = 
  text = $LAYOUT
  color = rgba(244, 244, 244, 0.25)
  font_size = 10
  font_family = JetBrains Mono Extrabold
  position = 0, -250
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(244, 244, 244, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = $TIME
  color = rgba(244, 244, 244, 0.75)
  font_size = 95
  font_family = JetBrains Mono Extrabold
  position = 0, 200
  halign = center
  valign = center
}

