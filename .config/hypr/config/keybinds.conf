#
# parameters that are responsible for key combinations

source = ~/.config/hypr/config/variables.conf																			# include variables config

# Main modifier
$mainMod = Super	


# Window/Session actions
bind = $mainMod, Q,				killactive,																		# close focused window
bind = Alt,		 F4,			killactive,																		# close focused window
bind = $mainMod, Delete,		exit,																			# kill hyprland session
bind = $mainMod, F,				togglefloating,																	# toggle floating mode
bind = $mainMod, G,				togglegroup,																	# toggle grouping mode
bind = $mainMod, F11,			fullscreen,																		# toggle fullscreen mode


# Application shortcuts
bind = $mainMod, Return,		exec, $term																		# launch terminal emulator	
bind = $mainMod, E,				exec, $file																		# launch file manager
bind = $mainMod, B,				exec, $browser																	# launch web browser
bind = $mainMod, N,				exec, $code																	# launch code editor
bind = $mainMod, Y,				exec, $term -e yazi																# launch yazi
bind = Ctrl+Shift, Escape,		exec, $term -e btop																# launch resorse monitor


# Rofi menus
bind = Alt,		 Space,			exec, $menu																		# launch rofi menu
bind = Alt,		 R,				exec, $scrPath/rofi-app-menu													# launch qpps menu
#bind = $mainMod, V				exec,																			# launch clipboard menu


# Fn keys
# Volume Control
bindel = , XF86AudioMute,		exec, pamixer -t																# F1 - volume mute/unmute
bindel = , XF86AudioLowerVolume,exec, pamixer -d 5																# F2 - volume down
bindel = , XF86AudioRaiseVolume,exec, pamixer -i 5																# F3 - volume up
bindel = , XF86AudioMicMute,	exec, pamixer --default-source -t												# F4 - microphone nute/unmute

# Brightness control
bindel = , XF86MonBrightnessDown,exec, brightnessctl set 5%-													# F5 - brightness down
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%														# F6 - brightness up

# Another actions
#bindel = , XF86Display, exec,																					# F7 - 
bindel = , XF86Tools,			exec, $scrPath/rofi-configbrowser-menu											# F9 - open config editor
#bindel = , XF86Favorites, exec,																				# F12 - 


# Screenshot/Screencapture
bind = $mainMod+Shift, S,		exec, $scrPath/screenshot p														# partial screenshot capturee
bind = , Print,					exec, $scrPath/screenshot pf													# partial screenshot capturee
bind = Alt, Print,				exec, $scrPath/screenshot pc													# partial screenshot capturee (clipboard)
bind = Ctrl, Print,				exec, $scrPath/screenshot am													# active monitor screenshot
bind = $mainMod, Print,			exec, $scrPath/screenshot aw													# active window screenshot
bind = $mainMod+Shift, Print,	exec, $scrPath/screenshot sw													# selected window screenshot


# Custom scripts
bind = $mainMod, L,				exec, $lockscreen																# launch lock screan 

#bind = $mainMod+Alt, G		 exec, $scrPath/gamemode.sh				 # disable hypr effects for gamemode
#bind = $mainMod+Alt, Up,	 exec, $scrPath/wbarconfgen.sh n			 # next waybar mode
#bind = $mainMod+Alt, Down,	 exec, $scrPath/wbarconfgen.sh p			 # previous waybar mode
#bind = $mainMod, K,		 exec, $scrPath/keyboardswitch.sh			 # switch keyboard layout
#bind = $mainMod+Shift, R,	 exec, pkill -x rofi || $scrPath/wallbashtoggle.sh -m	 # launch wallbash mode select menu
#bind = $mainMod+Shift, T,	 exec, pkill -x rofi || $scrPath/themeselect.sh		 # launch theme select menu
#bind = $mainMod+Shift, A,	 exec, pkill -x rofi || $scrPath/rofiselect.sh		 # launch select menu
#bind = $mainMod+Shift, X,	 exec, pkill -x rofi || $scrPath/themestyle.sh		 # launch theme style select menu
#bind = $mainMod+Shift, W,	 exec, pkill -x rofi || $scrPath/swwwallselect.sh	 # launch wallpaper select menu
#bind = $mainMod, V,		 exec, pkill -x rofi || $scrPath/cliphist.sh c		 # launch clipboard
#bind = $mainMod+Shift, V,	 exec, pkill -x rofi || $scrPath/cliphist.sh		 # launch clipboard Manager
#bind = $mainMod, slash,	 exec, pkill -x rofi || $scrPath/keybinds_hint.sh c	 # launch keybinds hint
#bind = $mainMod+Alt, A,	 exec, pkill -x rofi || $scrPath/animations.sh		 # launch animations Manager


# Move between grouped windows
#bind = $mainMod CTRL , H, changegroupactive, b
#bind = $mainMod CTRL , L, changegroupactive, f


# Move/Change window focus
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = Alt, Tab, movefocus, d


# Switch workspaces
#bind = $mainMod, B, workspace, name:WEB

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10


# Switch workspaces to a relative workspace
bind = $mainMod+Ctrl, Right, workspace, r+1
bind = $mainMod+Ctrl, Left, workspace, r-1


# Move to the first empty workspace
bind = $mainMod+Ctrl, Down, workspace, empty 


# Resize windows
binde = $mainMod+Shift, Right, resizeactive, 30 0
binde = $mainMod+Shift, Left, resizeactive, -30 0
binde = $mainMod+Shift, Up, resizeactive, 0 -30
binde = $mainMod+Shift, Down, resizeactive, 0 30


# Move focused window to a workspace
bind = $mainMod+Shift, 1, movetoworkspace, 1
bind = $mainMod+Shift, 2, movetoworkspace, 2
bind = $mainMod+Shift, 3, movetoworkspace, 3
bind = $mainMod+Shift, 4, movetoworkspace, 4
bind = $mainMod+Shift, 5, movetoworkspace, 5
bind = $mainMod+Shift, 6, movetoworkspace, 6
bind = $mainMod+Shift, 7, movetoworkspace, 7
bind = $mainMod+Shift, 8, movetoworkspace, 8
bind = $mainMod+Shift, 9, movetoworkspace, 9
bind = $mainMod+Shift, 0, movetoworkspace, 10


# Move focused window to a relative workspace
bind = $mainMod+Ctrl+Alt, Right, movetoworkspace, r+1
bind = $mainMod+Ctrl+Alt, Left, movetoworkspace, r-1


# Move active window around current workspace with mainMod + SHIFT + CTRL [←→↑↓]
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
binded = $mainMod SHIFT $CONTROL, left, Move activewindow left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
binded = $mainMod SHIFT $CONTROL, right, Move activewindow right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
binded = $mainMod SHIFT $CONTROL, up, Move activewindow up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
binded = $mainMod SHIFT $CONTROL, down, Move activewindow down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d


# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1


# Move/Resize focused window
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow


# Move/Switch to special workspace (scratchpad)
bind = $mainMod+Alt, S, movetoworkspacesilent, special
bind = $mainMod, S, togglespecialworkspace,


# Move focused window to a workspace silently
bind = $mainMod+Alt, 1, movetoworkspacesilent, 1
bind = $mainMod+Alt, 2, movetoworkspacesilent, 2
bind = $mainMod+Alt, 3, movetoworkspacesilent, 3
bind = $mainMod+Alt, 4, movetoworkspacesilent, 4
bind = $mainMod+Alt, 5, movetoworkspacesilent, 5
bind = $mainMod+Alt, 6, movetoworkspacesilent, 6
bind = $mainMod+Alt, 7, movetoworkspacesilent, 7
bind = $mainMod+Alt, 8, movetoworkspacesilent, 8
bind = $mainMod+Alt, 9, movetoworkspacesilent, 9
bind = $mainMod+Alt, 0, movetoworkspacesilent, 10
