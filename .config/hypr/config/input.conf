#
# parameters that are responsible for input
#
# see https://wiki.hyprland.org/Configurin/Variables/
# see https://wiki.hyprland.org/Configuring/Keywords/#executing

input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0.35
    force_no_accel = false
}

device {
    name = mosart-semi.-2.4g-input-device-mouse
    sensitivity = -0.1
}


gesture = 3, horizontal, workspace

gesture = 4, up, fullscreen
gesture = 4, down, float
gesture = 4, left, move
gesture = 4, right, move

gesture = 4, swipe, mod: SUPER, resize
