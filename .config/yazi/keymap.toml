# Minimal custom layer over the 26.9.1 default preset.
# `prepend_keymap` merges before the preset, so every default binding that is
# not overridden here keeps working — no need to copy the whole preset.
#
#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
	# One key for both jobs: enter directories, open files.
	{ on = "l",       run = "plugin smart-enter", desc = "Enter child dir, or open file" },
	{ on = "<Enter>", run = "plugin smart-enter", desc = "Enter child dir, or open file" },

	# Open the current directory in a new terminal window, detached from yazi.
	{ on = "<C-Enter>", run = 'shell --orphan -- kitty --directory "$(pwd)"', desc = "Open current dir in a new terminal" },

	# Drag the selected files out of the terminal ($@ is expanded by `shell`).
	{ on = "<C-g>", run = 'shell "ripdrag \"$@\" --and-exit &" --confirm', desc = "Drag and drop selected files" },
]
